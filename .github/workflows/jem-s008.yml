name: Jem Sprint 008 — Continuity and cinema integration
on:
  push:
    branches: [feat/jem-s008-character-continuity-20261027]
    paths:
      - 'video/**'
      - 'test/shot-continuity.test.mjs'
      - 'test/cinema-sequence.test.mjs'
      - '.github/workflows/jem-s008.yml'
  pull_request:
    paths:
      - 'video/**'
      - 'test/shot-continuity.test.mjs'
      - 'test/cinema-sequence.test.mjs'
      - '.github/workflows/jem-s008.yml'
permissions:
  contents: read
jobs:
  continuity-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check video/shot-continuity.mjs
          node --check video/cinema-session.mjs
      - name: Continuity and sequence regression
        run: node --experimental-sqlite --test test/shot-continuity.test.mjs test/cinema-sequence.test.mjs test/cinema-session.test.mjs
