name: Jem FilmFactory — screenplay to verified short film
on:
  push:
    branches: [feat/jem-film-factory-screenplay-to-film-20261026]
    paths:
      - 'factory/**'
      - 'originals/**'
      - 'test/factory*.mjs'
      - '.github/workflows/jem-film-factory.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'factory/**'
      - 'originals/**'
      - 'test/factory*.mjs'
      - '.github/workflows/jem-film-factory.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenplay-domain-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'
      - name: Verify syntax and screenplay negative tests
        run: |
          node --check factory/screenplay.mjs
          node --check factory/pipeline.mjs
          node --check factory/cli.mjs
          node --check originals/draw.mjs
          node --check originals/render.mjs
          npm run factory:test
  independent-film-factory-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'
      - name: Install free FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Real generator and refusal to fake referenced characters
        run: npm run factory:qa
